  spring.application.name=coupon-engine


# PostgreSQL database connection properties
spring.datasource.url=jdbc:postgresql://localhost:5434/coupondb
spring.datasource.username=coupon_user
spring.datasource.password=coupon_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties (optional, but commonly used)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect